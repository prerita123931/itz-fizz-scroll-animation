<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZ FIZZ - Scroll Driven Hero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero-section">
        <div class="sticky-hero">
            <div class="headline" id="headline">
                <span class="headline-letter">W</span>
                <span class="headline-letter">E</span>
                <span class="headline-letter">L</span>
                <span class="headline-letter">C</span>
                <span class="headline-letter">O</span>
                <span class="headline-letter">M</span>
                <span class="headline-letter">E</span>
                <span class="headline-space"></span>
                <span class="headline-letter">I</span>
                <span class="headline-letter">T</span>
                <span class="headline-letter">Z</span>
                <span class="headline-space"></span>
                <span class="headline-letter">F</span>
                <span class="headline-letter">I</span>
                <span class="headline-letter">Z</span>
                <span class="headline-letter">Z</span>
            </div>
            <div class="road-track">
                <div class="trail" id="trail"></div>
                <img id="car" class="car-image" src="assets\orange-car-top-view.png.png" alt="Orange sports car">
            </div>
            <div class="stats-container">
                <div class="stat-card" id="box1">
                    <span class="stat-number">58%</span>
                    <span class="stat-text">Increase in pick up point use</span>
                </div>
                <div class="stat-card" id="box2">
                    <span class="stat-number">23%</span>
                    <span class="stat-text">Decreased in customer phone calls</span>
                </div>
                <div class="stat-card" id="box3">
                    <span class="stat-number">27%</span>
                    <span class="stat-text">Increase in pick up point use</span>
                </div>
                <div class="stat-card" id="box4">
                    <span class="stat-number">40%</span>
                    <span class="stat-text">Decreased in customer phone calls</span>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
